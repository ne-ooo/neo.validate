name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

env:
  LPM_VERSION: "0.76.5"
  LPM_INSTALLER_SHA256: "edaadae414b2880b99111759a4d3338c9c92a4ec1884874fcb84aad7a8627811"

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Node.js ${{ matrix.node }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: ['18', '20', '22', '24']

    steps:
      - name: Check out the repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Install Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: ${{ matrix.node }}

      - name: Install LPM CLI
        env:
          LPM_INSTALL_VERSION: v${{ env.LPM_VERSION }}
        run: |
          curl --fail --silent --show-error --location "https://raw.githubusercontent.com/lpm-dev/rust-client/v${LPM_VERSION}/install.sh" --output "$RUNNER_TEMP/install-lpm.sh"
          echo "${LPM_INSTALLER_SHA256}  $RUNNER_TEMP/install-lpm.sh" | sha256sum --check --strict
          sh "$RUNNER_TEMP/install-lpm.sh"
          echo "$HOME/.lpm/bin" >> "$GITHUB_PATH"
          "$HOME/.lpm/bin/lpm" --version

      - name: Cache the LPM store
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: ~/.lpm/store
          key: lpm-store-${{ runner.os }}-node-${{ matrix.node }}-${{ hashFiles('lpm.lock') }}
          restore-keys: lpm-store-${{ runner.os }}-node-${{ matrix.node }}-

      - name: Install dependencies for Node.js 18 compatibility
        if: matrix.node == '18'
        run: lpm ci --strict-integrity --no-engine-strict --no-skills --no-editor-setup --no-security-summary

      - name: Install dependencies from the lockfile
        if: matrix.node != '18'
        run: lpm ci --strict-integrity --no-skills --no-editor-setup --no-security-summary

      - name: Run compatibility checks
        if: matrix.node != '24'
        run: |
          lpm run typecheck
          lpm run test
          lpm run build
          lpm run test:package

      - name: Run the release check
        if: matrix.node == '24'
        run: lpm run release:check

      - name: Check the publish package
        if: matrix.node == '24'
        run: lpm publish --check --yes
