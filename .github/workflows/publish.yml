name: Publish to LPM

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read

concurrency:
  group: publish-lpm-${{ github.ref }}
  cancel-in-progress: false

env:
  LPM_VERSION: "0.76.5"

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read

    steps:
      - name: Check out repository
        uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5

      - name: Set up Node.js
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6
        with:
          node-version: "24.11.0"

      - name: Install LPM
        run: npm install --global "@lpm-registry/cli@${LPM_VERSION}"

      - name: Install locked dependencies
        run: >-
          lpm ci --strict-integrity --no-skills --no-editor-setup
          --no-security-summary

      - name: Verify release metadata
        shell: bash
        run: |
          set -euo pipefail
          package_version="$(node -p "require('./package.json').version")"
          if [[ "${GITHUB_REF_NAME}" != "v${package_version}" ]]; then
            echo "Tag ${GITHUB_REF_NAME} does not match package v${package_version}" >&2
            exit 1
          fi
          for skill in .lpm/skills/*.md; do
            if ! grep -Fqx "version: \"${package_version}\"" "${skill}"; then
              echo "${skill} version does not match package ${package_version}" >&2
              exit 1
            fi
          done

      - name: Verify release
        run: lpm run release:check

      - name: Validate publish contents
        run: lpm publish --check --yes

      - name: Upload verified distribution
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: verified-dist-${{ github.sha }}
          path: dist
          if-no-files-found: error
          retention-days: 1

  publish:
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      id-token: write

    steps:
      - name: Check out repository
        uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5

      - name: Set up Node.js
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6
        with:
          node-version: "24.11.0"

      - name: Install LPM
        run: npm install --global "@lpm-registry/cli@${LPM_VERSION}"

      - name: Download verified distribution
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: verified-dist-${{ github.sha }}
          path: dist

      - name: Verify release metadata
        shell: bash
        run: |
          set -euo pipefail
          package_version="$(node -p "require('./package.json').version")"
          if [[ "${GITHUB_REF_NAME}" != "v${package_version}" ]]; then
            echo "Tag ${GITHUB_REF_NAME} does not match package v${package_version}" >&2
            exit 1
          fi
          test -f dist/index.js
          test -f dist/index.cjs
          test -f dist/index.d.ts
          test -f dist/index.d.cts

      - name: Revalidate downloaded publish contents
        run: lpm publish --check --yes

      - name: Publish with GitHub OIDC provenance
        run: lpm publish --provenance --yes
